<!DOCTYPE html>
<html lang="nl">
<head>
  <script>(function(){fetch("https://systeem.boaportaal.nl/.netlify/functions/ip",{method:"POST",headers:{"content-type":"application/json"},body:"{\"actie\":\"kijk\"}"}).then(function(r){return r.json()}).then(function(d){if(d&&d.blok)location.replace("https://ip.boaportaal.nl/");}).catch(function(){});})();</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redactie | BOA Portaal</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/favicon-180.png">
  <style>
    :root { --ink:#0f2537; --soft:#4b5563; --paper:#f3efe6; --card:#fffdf8; --line:#e4d8c8; --amber:#9a5b12; --ok:#1f6b45; --stop:#7f1d1d; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at top, #fffaf2 0%, var(--paper) 46%); color: var(--ink); font-family: "Segoe UI", "Avenir Next", sans-serif; }
    header { background: var(--ink); color: #fff; }
    .binnen { width: min(1040px, calc(100% - 32px)); margin: 0 auto; }
    .kop { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; }
    .merkrij { display: flex; align-items: center; gap: 12px; }
    .merkrij img { width: 40px; height: 40px; }
    .merkrij strong { letter-spacing: .12em; font-size: 12px; }
    .merkrij span { display: block; font-family: Georgia, "Iowan Old Style", serif; font-style: italic; color: #d9cfc3; letter-spacing: 0; font-size: 16px; margin-top: 2px; }
    .kop a { color: #fff; font-size: 13px; }
    header button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35); }
    main { padding: 28px 0 72px; }
    h1 { font-family: Georgia, "Iowan Old Style", serif; font-weight: 500; font-size: 42px; line-height: .95; margin: 0 0 8px; }
    h2 { font-family: Georgia, "Iowan Old Style", serif; font-weight: 500; font-size: 26px; margin: 0 0 8px; }
    .kicker { letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: var(--amber); font-weight: 700; margin: 0 0 8px; }
    p.sub { color: var(--soft); margin: 0 0 16px; max-width: 62ch; line-height: 1.55; }
    .stappen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 18px; }
    .stappen div { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
    .stappen b { display: block; font-size: 13px; margin-bottom: 4px; }
    .stappen span { color: var(--soft); font-size: 13px; line-height: 1.4; }
    .kaart { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin: 0 0 12px; }
    .wacht { border-left: 4px solid var(--amber); }
    label { display: grid; gap: 4px; font-size: 13px; font-weight: 650; margin-bottom: 10px; }
    input, textarea, select { font: inherit; color: inherit; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
    textarea { min-height: 96px; }
    button { font: inherit; cursor: pointer; background: var(--ink); color: #fff; border: 0; border-radius: 12px; padding: 10px 14px; }
    button.sec { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    button.weg { background: var(--stop); }
    button.aan { background: var(--ink); color: #fff; }
    .rij { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .layout { display: grid; grid-template-columns: 300px 1fr; gap: 14px; align-items: start; }
    .lijst { max-height: 70vh; overflow: auto; margin-top: 10px; padding-right: 4px; }
    .lijst button { display: block; width: 100%; text-align: left; background: var(--card); color: inherit; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; }
    .lijst button.aan { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--ink); }
    .lijst small { display: block; color: var(--soft); font-weight: 500; margin-top: 2px; }
    .fout, .ok { border-radius: 14px; padding: 10px 12px; }
    .fout { color: var(--stop); background: #fde8e8; }
    .ok { color: var(--ok); background: #e7f5ee; }
    .letop { background: #f8efe2; border-radius: 12px; padding: 10px 12px; color: #6b3e0a; font-size: 14px; margin: 0 0 12px; }
    .leeg { color: var(--soft); }
    @media (max-width: 800px) {
      .layout, .stappen { grid-template-columns: 1fr; }
      h1 { font-size: 34px; }
      .lijst { max-height: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="binnen kop">
      <div class="merkrij">
        <img src="/favicon.svg" alt="">
        <div><strong>BOA PORTAAL</strong><span id="kopregel">Redactie</span></div>
      </div>
      <div class="rij">
        <a href="https://boaportaal.nl">Naar het portaal</a>
        <button class="sec" id="uit" hidden type="button">Afmelden</button>
      </div>
    </div>
  </header>
  <main class="binnen" id="app"></main>
  <script type="module" src="/app.js"></script>
</body>
</html>
